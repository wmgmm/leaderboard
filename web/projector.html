<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Matts - Community Top of the Prompts: the chart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="projector">
    <!-- The same blue banner as the top of the workshop page, so the two match. -->
    <header class="activity-hero community">
        <div class="hero-glass">
            <div class="hero-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 3v4"/><path d="M12 17v4"/><path d="M3 12h4"/><path d="M17 12h4"/>
                    <path d="M5.6 5.6l2.8 2.8"/><path d="M15.6 15.6l2.8 2.8"/><path d="M5.6 18.4l2.8-2.8"/><path d="M15.6 8.4l2.8-2.8"/>
                </svg>
            </div>
            <div class="hero-content">
                <span class="hero-eyebrow">Community Activity · Live vote</span>
                <h1 class="hero-title">Community Top of the Prompts</h1>
                <span class="hero-desc">Find your next experiment and share what is useful.</span>
            </div>
            <p id="meta" class="hero-count">Tuning in...</p>
        </div>
    </header>
    <main>
        <nav id="filters" aria-label="Chart views"></nav>
        <ol id="chart"></ol>
    </main>
    <script src="projector.js"></script>
</body>
</html>
